<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Neon Snake</title>
    <style>
      :root {
        --bg: #0d1117;
        --primary: #6c5ce7;
        --secondary: #00d2ff;
        --accent: #00ffb3;
        --text: #fff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        background:
          radial-gradient(800px 400px at 50% -10%, rgba(108, 92, 231, 0.25), transparent 60%),
          radial-gradient(600px 300px at 90% 110%, rgba(0, 210, 255, 0.18), transparent 55%);
      }
      canvas { display: block; touch-action: none; }
      #hud {
        position: absolute;
        top: 14px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 18px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
        pointer-events: none;
      }
      #hud .label { color: #9aa4b2; font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; }
      #score { color: var(--accent); }
      #best { color: var(--secondary); }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(13, 17, 23, 0.78);
        backdrop-filter: blur(6px);
        text-align: center;
        padding: 24px;
      }
      .overlay.hidden { display: none; }
      h1 {
        font-size: 30px;
        background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 1px;
      }
      p { color: #9aa4b2; font-size: 14px; max-width: 280px; line-height: 1.5; }
      button {
        margin-top: 4px;
        padding: 12px 26px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        box-shadow: 0 0 24px rgba(108, 92, 231, 0.5);
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      button:hover { filter: brightness(1.1); transform: translateY(-1px); }
      button:active { transform: scale(0.97); }
      .final { font-size: 18px; color: #fff; }
      .final b { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="hud">
        <div><div class="label">Score</div><div id="score">0</div></div>
        <div style="text-align:right"><div class="label">Best</div><div id="best">0</div></div>
      </div>
      <div id="start" class="overlay">
        <h1>NEON SNAKE</h1>
        <p>Eat the glowing orbs, grow your tail and avoid the walls and yourself. Use arrow keys, WASD or swipe.</p>
        <button id="startBtn">Play</button>
      </div>
      <div id="over" class="overlay hidden">
        <h1>GAME OVER</h1>
        <p class="final">Score: <b id="finalScore">0</b></p>
        <button id="retryBtn">Play Again</button>
      </div>
    </div>

    <script>
      (function () {
        var canvas = document.getElementById('game');
        var ctx = canvas.getContext('2d');
        var scoreEl = document.getElementById('score');
        var bestEl = document.getElementById('best');
        var finalEl = document.getElementById('finalScore');
        var startOverlay = document.getElementById('start');
        var overOverlay = document.getElementById('over');

        var GRID = 22; // cells
        var cell = 20;
        var size = GRID * cell;

        function fit() {
          var min = Math.min(window.innerWidth, window.innerHeight) - 16;
          min = Math.max(220, Math.min(min, 520));
          cell = Math.floor(min / GRID);
          size = cell * GRID;
          canvas.width = size;
          canvas.height = size;
          canvas.style.width = size + 'px';
          canvas.style.height = size + 'px';
        }
        window.addEventListener('resize', fit);
        fit();

        var snake, dir, nextDir, food, score, best, running, paused, tickMs, acc, last, raf;
        best = parseInt(localStorage.getItem('neon-snake-best') || '0', 10);
        bestEl.textContent = best;

        function reset() {
          snake = [{ x: 10, y: 11 }, { x: 9, y: 11 }, { x: 8, y: 11 }];
          dir = { x: 1, y: 0 };
          nextDir = { x: 1, y: 0 };
          score = 0;
          tickMs = 130;
          acc = 0;
          last = 0;
          placeFood();
          scoreEl.textContent = '0';
        }

        function placeFood() {
          while (true) {
            var f = { x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0 };
            var hit = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
            if (!hit) { food = f; return; }
          }
        }

        function setDir(x, y) {
          if (dir.x === -x && dir.y === -y) return; // no reverse
          nextDir = { x: x, y: y };
        }

        document.addEventListener('keydown', function (e) {
          var k = e.key.toLowerCase();
          if (k === 'arrowup' || k === 'w') setDir(0, -1);
          else if (k === 'arrowdown' || k === 's') setDir(0, 1);
          else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
          else if (k === 'arrowright' || k === 'd') setDir(1, 0);
          else if (k === 'p') paused = !paused;
          if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase()) >= 0) e.preventDefault();
        });

        // touch swipe
        var tStart = null;
        canvas.addEventListener('touchstart', function (e) {
          tStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });
        canvas.addEventListener('touchmove', function (e) {
          if (!tStart) return;
          var dx = e.touches[0].clientX - tStart.x;
          var dy = e.touches[0].clientY - tStart.y;
          if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
          if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
          else setDir(0, dy > 0 ? 1 : -1);
          tStart = null;
        }, { passive: true });

        function step() {
          dir = nextDir;
          var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
          if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return gameOver();
          if (snake.some(function (s) { return s.x === head.x && s.y === head.y; })) return gameOver();
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreEl.textContent = score;
            if (tickMs > 70) tickMs -= 2;
            placeFood();
          } else {
            snake.pop();
          }
        }

        function draw() {
          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, size, size);
          // grid
          ctx.strokeStyle = 'rgba(255,255,255,0.04)';
          ctx.lineWidth = 1;
          for (var i = 1; i < GRID; i++) {
            ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
          }
          // food
          ctx.save();
          ctx.shadowColor = '#00ffb3';
          ctx.shadowBlur = 18;
          ctx.fillStyle = '#00ffb3';
          ctx.beginPath();
          ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell / 2.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          // snake
          for (var s = snake.length - 1; s >= 0; s--) {
            var seg = snake[s];
            var t = s / snake.length;
            var r = Math.round(108 + (0 - 108) * (1 - t));
            var g = Math.round(92 + (210 - 92) * (1 - t));
            var b = Math.round(231 + (255 - 231) * (1 - t));
            ctx.save();
            if (s === 0) { ctx.shadowColor = '#00d2ff'; ctx.shadowBlur = 16; }
            ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
            roundRect(seg.x * cell + 1.5, seg.y * cell + 1.5, cell - 3, cell - 3, 5);
            ctx.fill();
            ctx.restore();
          }
        }

        function roundRect(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        function loop(ts) {
          if (!running) return;
          if (!last) last = ts;
          var dt = ts - last;
          last = ts;
          if (!paused) {
            acc += dt;
            while (acc >= tickMs) { step(); acc -= tickMs; if (!running) break; }
          }
          draw();
          raf = requestAnimationFrame(loop);
        }

        function start() {
          reset();
          running = true;
          paused = false;
          startOverlay.classList.add('hidden');
          overOverlay.classList.add('hidden');
          last = 0;
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(loop);
        }

        function gameOver() {
          running = false;
          cancelAnimationFrame(raf);
          if (score > best) {
            best = score;
            localStorage.setItem('neon-snake-best', String(best));
            bestEl.textContent = best;
          }
          finalEl.textContent = score;
          overOverlay.classList.remove('hidden');
          draw();
          // report score to parent portal (optional integration hook)
          try { window.parent.postMessage({ type: 'gameverse:score', game: 'neon-snake', score: score }, '*'); } catch (e) {}
        }

        document.getElementById('startBtn').addEventListener('click', start);
        document.getElementById('retryBtn').addEventListener('click', start);

        // initial paint
        reset();
        draw();
      })();
    </script>
  </body>
</html>
