<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Neon Breakout</title>
    <style>
      :root { --bg:#0d1117; --primary:#6c5ce7; --secondary:#00d2ff; --accent:#00ffb3; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%; background: var(--bg); color: #fff;
        font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden;
        touch-action: none; -webkit-user-select: none; user-select: none;
      }
      #wrap {
        position: relative; display: flex; align-items: center; justify-content: center; height: 100%;
        background:
          radial-gradient(800px 400px at 50% -10%, rgba(0,210,255,0.22), transparent 60%),
          radial-gradient(600px 300px at 10% 110%, rgba(108,92,231,0.20), transparent 55%);
      }
      canvas { display: block; touch-action: none; border-radius: 10px; }
      #hud {
        position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: space-between;
        padding: 0 18px; font-weight: 700; font-size: 15px; pointer-events: none;
      }
      #hud .label { color:#9aa4b2; font-size:11px; text-transform:uppercase; letter-spacing:1.5px; }
      #score { color: var(--accent); } #lives { color: #ff6b81; } #level { color: var(--secondary); }
      .overlay {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 14px; background: rgba(13,17,23,0.8); backdrop-filter: blur(6px);
        text-align: center; padding: 24px;
      }
      .overlay.hidden { display: none; }
      h1 {
        font-size: 28px; letter-spacing: 1px;
        background: linear-gradient(90deg, var(--secondary), var(--primary), var(--accent));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      p { color:#9aa4b2; font-size:14px; max-width:300px; line-height:1.5; }
      button {
        margin-top:4px; padding:12px 26px; font-size:15px; font-weight:700; color:#fff; border:none;
        border-radius:12px; cursor:pointer; background: linear-gradient(90deg, var(--primary), var(--secondary));
        box-shadow: 0 0 24px rgba(0,210,255,0.45); transition: transform .15s, filter .15s;
      }
      button:hover { filter: brightness(1.1); transform: translateY(-1px); }
      button:active { transform: scale(0.97); }
      .final b { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="hud">
        <div><div class="label">Score</div><div id="score">0</div></div>
        <div style="text-align:center"><div class="label">Level</div><div id="level">1</div></div>
        <div style="text-align:right"><div class="label">Lives</div><div id="lives">3</div></div>
      </div>
      <div id="start" class="overlay">
        <h1>NEON BREAKOUT</h1>
        <p>Bounce the ball off your paddle and smash every brick. Move with mouse, arrow keys or drag. Don&apos;t let the ball fall!</p>
        <button id="startBtn">Play</button>
      </div>
      <div id="end" class="overlay hidden">
        <h1 id="endTitle">GAME OVER</h1>
        <p class="final">Score: <b id="finalScore">0</b></p>
        <button id="retryBtn">Play Again</button>
      </div>
    </div>

    <script>
      (function () {
        var canvas = document.getElementById('game');
        var ctx = canvas.getContext('2d');
        var scoreEl = document.getElementById('score');
        var livesEl = document.getElementById('lives');
        var levelEl = document.getElementById('level');
        var startOverlay = document.getElementById('start');
        var endOverlay = document.getElementById('end');
        var endTitle = document.getElementById('endTitle');
        var finalEl = document.getElementById('finalScore');

        var W = 420, H = 520;
        function fit() {
          var maxW = Math.min(window.innerWidth - 16, 460);
          var maxH = window.innerHeight - 16;
          var ratio = 420 / 520;
          var w = maxW, h = w / ratio;
          if (h > maxH) { h = maxH; w = h * ratio; }
          W = Math.round(w); H = Math.round(h);
          canvas.width = W; canvas.height = H;
          canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        }
        window.addEventListener('resize', function(){ fit(); resetPositions(); draw(); });
        fit();

        var COLORS = ['#ff6b81', '#ffa94d', '#ffe066', '#00ffb3', '#00d2ff', '#6c5ce7'];
        var paddle, ball, bricks, score, lives, level, running, launched, raf;

        function newBricks() {
          bricks = [];
          var rows = 4 + Math.min(level, 4);
          var cols = 7;
          var pad = W * 0.02;
          var bw = (W - pad * (cols + 1)) / cols;
          var bh = H * 0.035;
          var top = H * 0.10;
          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              bricks.push({
                x: pad + c * (bw + pad), y: top + r * (bh + pad),
                w: bw, h: bh, alive: true, color: COLORS[r % COLORS.length],
                hp: r < 1 && level > 2 ? 2 : 1
              });
            }
          }
        }

        function resetPositions() {
          var pw = W * 0.2;
          paddle = { w: pw, h: H * 0.02, x: (W - pw) / 2, y: H - H * 0.06, speed: W * 0.012 };
          var sp = Math.min(W, H) * 0.011 + level * 0.3;
          ball = { x: W / 2, y: paddle.y - 10, r: Math.max(5, W * 0.014), vx: sp, vy: -sp, speed: sp };
          launched = false;
        }

        function startGame() {
          score = 0; lives = 3; level = 1;
          scoreEl.textContent = 0; livesEl.textContent = 3; levelEl.textContent = 1;
          newBricks(); resetPositions();
          running = true;
          startOverlay.classList.add('hidden');
          endOverlay.classList.add('hidden');
          cancelAnimationFrame(raf);
          loop();
        }

        function nextLevel() {
          level++; levelEl.textContent = level;
          newBricks(); resetPositions();
        }

        function endGame(won) {
          running = false;
          cancelAnimationFrame(raf);
          endTitle.textContent = won ? 'YOU WIN!' : 'GAME OVER';
          finalEl.textContent = score;
          endOverlay.classList.remove('hidden');
          try { window.parent.postMessage({ type: 'gameverse:score', game: 'neon-breakout', score: score }, '*'); } catch (e) {}
        }

        // input
        var left = false, right = false;
        document.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') left = true;
          if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') right = true;
          if (e.key === ' ') { launched = true; e.preventDefault(); }
        });
        document.addEventListener('keyup', function (e) {
          if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') left = false;
          if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') right = false;
        });
        function movePaddleTo(clientX) {
          var rect = canvas.getBoundingClientRect();
          var x = (clientX - rect.left) * (W / rect.width);
          paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
          launched = true;
        }
        canvas.addEventListener('mousemove', function (e) { movePaddleTo(e.clientX); });
        canvas.addEventListener('touchstart', function (e) { movePaddleTo(e.touches[0].clientX); }, { passive: true });
        canvas.addEventListener('touchmove', function (e) { movePaddleTo(e.touches[0].clientX); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('click', function () { launched = true; });

        function update() {
          if (left) paddle.x = Math.max(0, paddle.x - paddle.speed * 6);
          if (right) paddle.x = Math.min(W - paddle.w, paddle.x + paddle.speed * 6);

          if (!launched) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - ball.r - 1; return; }

          ball.x += ball.vx; ball.y += ball.vy;
          if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; }
          if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
          if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; }

          // paddle collision
          if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 12 &&
              ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
            var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
            var angle = hit * (Math.PI / 3); // up to 60deg
            var sp = ball.speed * 1.0;
            ball.vx = sp * Math.sin(angle);
            ball.vy = -Math.abs(sp * Math.cos(angle));
          }

          // bricks
          for (var i = 0; i < bricks.length; i++) {
            var b = bricks[i];
            if (!b.alive) continue;
            if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
                ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
              // determine bounce axis
              var overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
              var overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
              if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
              b.hp--;
              if (b.hp <= 0) { b.alive = false; score += 10; } else { score += 5; }
              scoreEl.textContent = score;
              break;
            }
          }

          if (bricks.every(function (b) { return !b.alive; })) {
            if (level >= 6) return endGame(true);
            nextLevel();
          }

          // fell
          if (ball.y - ball.r > H) {
            lives--; livesEl.textContent = lives;
            if (lives <= 0) return endGame(false);
            resetPositions();
          }
        }

        function draw() {
          ctx.fillStyle = '#0d1117';
          ctx.fillRect(0, 0, W, H);
          // bricks
          for (var i = 0; i < bricks.length; i++) {
            var b = bricks[i];
            if (!b.alive) continue;
            ctx.save();
            ctx.shadowColor = b.color; ctx.shadowBlur = 10;
            ctx.fillStyle = b.color;
            rr(b.x, b.y, b.w, b.h, 4); ctx.fill();
            if (b.hp > 1) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; rr(b.x, b.y, b.w, b.h, 4); ctx.fill(); }
            ctx.restore();
          }
          // paddle
          ctx.save();
          ctx.shadowColor = '#00d2ff'; ctx.shadowBlur = 16;
          var grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
          grad.addColorStop(0, '#6c5ce7'); grad.addColorStop(1, '#00d2ff');
          ctx.fillStyle = grad;
          rr(paddle.x, paddle.y, paddle.w, paddle.h, paddle.h / 2); ctx.fill();
          ctx.restore();
          // ball
          ctx.save();
          ctx.shadowColor = '#00ffb3'; ctx.shadowBlur = 18;
          ctx.fillStyle = '#00ffb3';
          ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        function rr(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        function loop() {
          if (!running) return;
          update();
          draw();
          raf = requestAnimationFrame(loop);
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('retryBtn').addEventListener('click', startGame);

        // initial
        level = 1; newBricks(); resetPositions(); draw();
      })();
    </script>
  </body>
</html>
